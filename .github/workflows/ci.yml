name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single decision point for skipping real work on release-please
  # branches (version bump + changelog only, nothing worth linting/testing).
  # gate itself always runs and succeeds -- cheap either way -- so it can't
  # be the thing left "skipped". It hands its determination to each
  # downstream job as a workflow_call input; branch protection then sees a
  # real success/failure conclusion from every required check on every PR,
  # instead of the "skipped" state it can't distinguish from "never ran".
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      is_release_please: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.ref }}
        run: |
          if [[ "$HEAD_REF" == release-please--* || "$BASE_REF" == refs/heads/release-please--* ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  phpcs:
    needs: gate
    uses: ./.github/workflows/phpcs.yml

  phpstan:
    needs: gate
    uses: ./.github/workflows/phpstan.yml

  phpunit:
    needs: gate
    uses: ./.github/workflows/phpunit.yml
    with:
      skip: ${{ needs.gate.outputs.is_release_please == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  plugin-check:
    needs: gate
    uses: ./.github/workflows/plugin-check.yml
    with:
      skip: ${{ needs.gate.outputs.is_release_please == 'true' }}

  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml

  playwright:
    needs: gate
    uses: ./.github/workflows/playwright.yml
