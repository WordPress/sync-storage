name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single decision point for skipping real work on release-please
  # branches (version bump + changelog only, nothing worth linting/testing).
  # gate itself always runs and succeeds -- cheap either way -- so it can't
  # be the thing left "skipped". It passes its result to phpunit and
  # plugin-check only, as a workflow_call input. phpcs, phpstan, typos and
  # playwright have no such input and always run in full.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      is_release_please: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.ref }}
        run: |
          if [[ "$HEAD_REF" == release-please--* || "$BASE_REF" == refs/heads/release-please--* ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

  phpcs:
    needs: gate
    uses: ./.github/workflows/phpcs.yml

  phpstan:
    needs: gate
    uses: ./.github/workflows/phpstan.yml

  phpunit:
    needs: gate
    uses: ./.github/workflows/phpunit.yml
    with:
      skip: ${{ needs.gate.outputs.is_release_please == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  plugin-check:
    needs: gate
    uses: ./.github/workflows/plugin-check.yml
    with:
      skip: ${{ needs.gate.outputs.is_release_please == 'true' }}

  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml

  playwright:
    needs: gate
    uses: ./.github/workflows/playwright.yml

  # The one context branch protection pins. Matrix legs name themselves after
  # their matrix values ("phpunit / PHP 8.3 / WP latest"), so requiring those
  # names directly breaks whenever the matrix changes -- the required check
  # keeps waiting on a name nothing reports anymore.
  #
  # if: always() is what makes it report on failure instead of being skipped
  # along with everything downstream of a failed job, which would leave the
  # required check stuck in exactly the state this job exists to avoid.
  ci-status:
    needs: [ phpcs, phpstan, phpunit, plugin-check, typos, playwright ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Every job above always runs -- the release-please skip is applied per
      # step, not per job -- so anything other than success is a real problem.
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON( needs ) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed=$( jq -r 'to_entries[] | select( .value.result != "success" ) | .key' <<< "$NEEDS" )
          if [[ -n "$failed" ]]; then
            echo "::error::Did not succeed: $( echo "$failed" | tr '\n' ' ' )"
            exit 1
          fi
