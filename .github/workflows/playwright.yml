name: Playwright

on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-24.04
    # The browser install is separately bounded at 10 minutes worst case, so
    # this only needs headroom for the Gutenberg build and the test run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env is gitignored (local-only overrides); CI never has one. Without
      # it, @wordpress/e2e-test-utils-playwright falls back to its own
      # internal default of localhost:8889 -- the wp-env "tests" environment,
      # not the "development" one this workflow starts -- for REST root
      # discovery specifically, causing every REST call to 403 against the
      # wrong WordPress instance. .env.example is the single committed source
      # of truth for these values; copy it so CI loads the same defaults as
      # local dev instead of duplicating them here.
      - run: cp .env.example .env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer

      - run: npm ci

      - name: Authenticate composer to GitHub
        run: composer config --global --auth github-oauth.github.com '${{ secrets.GITHUB_TOKEN }}'

      - name: Install Composer dependencies
        run: composer install --no-interaction

      # Keyed on the resolved Playwright version rather than the whole
      # lockfile hash, so unrelated dependency bumps don't invalidate a
      # perfectly good browser cache -- only an actual Playwright version
      # change should force a re-download.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --with-deps runs apt-get to install OS-level libraries every time,
      # even when the browser binary itself is already cached. Those
      # libraries come from the runner image, not the browser version, so
      # they don't need reinstalling on a cache hit -- skipping apt-get here
      # avoids depending on the package mirror being fast (or up) on every
      # single run.
      #
      # apt-get has no default timeout, so a stalled mirror hangs silently
      # until the job's own timeout-minutes kills the whole run (seen live:
      # a dead archive.ubuntu.com mirror ate a full 30 minutes). Wrapping in
      # `timeout` bounds each attempt, and retrying once covers a mirror
      # that's back after a minute rather than failing the run outright.
      - name: Install Playwright browsers
        env:
          CACHE_HIT: ${{ steps.cache-playwright.outputs.cache-hit }}
        run: |
          args=()
          [ "$CACHE_HIT" = "true" ] || args+=(--with-deps)
          timeout 5m npx playwright install "${args[@]}" chromium || \
          timeout 5m npx playwright install "${args[@]}" chromium

      # Restores the most recent cached checkout as a starting point, then
      # build-gutenberg.sh fetches and fast-forwards it to the latest trunk
      # commit before building, so npm install/webpack build run
      # incrementally instead of from scratch every run. Always saves a
      # fresh cache under this run's own key so the restore point keeps
      # rolling forward; it never pins to a stale commit.
      - name: Cache Gutenberg trunk checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: gutenberg
          key: gutenberg-trunk-${{ github.run_id }}
          restore-keys: |
            gutenberg-trunk-

      - name: Build Gutenberg trunk
        run: bash build-gutenberg.sh

      - name: Start wp-env
        run: npx wp-env start

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
