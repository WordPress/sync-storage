name: PHPUnit

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        default: false
      wp-versions:
        description: >-
          JSON array of WordPress versions to run the matrix against.
          "latest" tracks the current stable release, "trunk" the nightly
          build, and a bare version number pins the matching tag on the core
          git mirror.
        type: string
        default: '[ "latest" ]'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-24.04
    # Caps the unbounded network work here (Gutenberg clone, npm install,
    # wp-env image builds), which would otherwise run to GitHub's 360-minute
    # default -- a stalled mirror has hung this job before.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the `Requires PHP` floor and 8.5 the current release, so a
        # deprecation at either end of the supported range fails a leg rather
        # than reaching a site. 8.3 and 8.4 cover the middle.
        php: [ '7.4', '8.3', '8.4', '8.5' ]
        wp: ${{ fromJSON( inputs.wp-versions ) }}
        # Coverage is a property of one leg, not a dimension: running it on
        # every combination would upload near-identical reports and add Xdebug
        # overhead to the whole matrix for no extra signal.
        include:
          - php: '8.3'
            wp: 'latest'
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.skip }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !inputs.skip }}
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: ${{ !inputs.skip }}
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: npm ci
        if: ${{ !inputs.skip }}
      - name: Authenticate composer to GitHub
        if: ${{ !inputs.skip }}
        run: composer config --global --auth github-oauth.github.com '${{ secrets.GITHUB_TOKEN }}'
      - name: Install Composer dependencies
        if: ${{ !inputs.skip }}
        run: composer install --no-interaction
      # Restores the most recent cached checkout as a starting point, then
      # build-gutenberg.sh fetches and fast-forwards it to the latest trunk
      # commit before building. The checkout does not depend on the PHP or
      # WordPress version a leg runs against, so every leg restores from one
      # shared family -- including the entries the Playwright workflow saves.
      # The paired save step below the build rolls the restore point forward.
      - name: Restore Gutenberg trunk checkout
        if: ${{ !inputs.skip }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: gutenberg
          key: gutenberg-trunk-${{ github.run_id }}-phpunit
          restore-keys: |
            gutenberg-trunk-
      # .wp-env.json sets `"core": null`, which wp-env resolves to the current
      # stable release, so the "latest" leg leaves WP_ENV_CORE unset and
      # inherits that. The other legs override it:
      #
      # - "trunk" pins the nightly build. This is the leg that earns the
      #   matrix its keep -- a core change that breaks the plugin fails here
      #   while it is still unreleased, rather than after it has autoupdated
      #   onto users' sites.
      # - A bare version pins the matching tag on the core git mirror, so the
      #   `Requires at least` floor in readme.txt is a claim CI checks rather
      #   than one a human last verified some releases ago.
      #
      # The version goes through the environment rather than straight into the
      # script, so a matrix value can never be interpolated as shell.
      - name: Resolve the WordPress version under test
        if: ${{ !inputs.skip }}
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          case "$WP_VERSION" in
            latest) ;;
            trunk)  echo "WP_ENV_CORE=https://wordpress.org/nightly-builds/wordpress-latest.zip" >> "$GITHUB_ENV" ;;
            *)      echo "WP_ENV_CORE=WordPress/WordPress#${WP_VERSION}" >> "$GITHUB_ENV" ;;
          esac
      - name: Build Gutenberg trunk and start wp-env
        if: ${{ !inputs.skip }}
        run: bash build-gutenberg.sh && npx wp-env start ${{ matrix.coverage && '--xdebug=coverage' || '' }}
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
      # The checkout is identical across legs, so only the coverage leg --
      # the one leg every matrix has -- saves. The suffix avoids colliding
      # with the Playwright workflow's save in the same run.
      - name: Save Gutenberg trunk checkout
        if: ${{ !inputs.skip && matrix.coverage }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: gutenberg
          key: gutenberg-trunk-${{ github.run_id }}-phpunit
      - if: ${{ !inputs.skip }}
        run: npx wp-env run tests-cli --env-cwd='wp-content/plugins/sync-storage' -- ./vendor/bin/phpunit ${{ matrix.coverage && '--coverage-clover coverage.xml' || '' }}
      - name: Upload coverage to Codecov
        if: ${{ !inputs.skip && matrix.coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: phpunit
      # Multisite testing - RTC plugin needs to verify multisite table creation
      # and cleanup behavior. The network provisioning lives in lib/install.php
      # and would show as uncovered without this run.
      - name: Run the suite as multisite
        if: ${{ !inputs.skip && matrix.coverage }}
        run: npx wp-env run tests-cli --env-cwd='wp-content/plugins/sync-storage' -- env WP_MULTISITE=1 ./vendor/bin/phpunit --coverage-clover coverage-multisite.xml
      - name: Upload multisite coverage to Codecov
        if: ${{ !inputs.skip && matrix.coverage }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-multisite.xml
          flags: multisite
